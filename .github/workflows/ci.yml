name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python - Motor de Simulación
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: motor-simulacion/requirements-dev.txt

      - name: Install dependencies
        working-directory: motor-simulacion
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: motor-simulacion
        run: pytest tests/ -v --tb=short

  dotnet-tests:
    name: C# - Backend API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Run tests
        working-directory: backend
        run: dotnet test --verbosity normal

